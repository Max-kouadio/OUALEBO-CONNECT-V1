<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nettoyage du cache</title>
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f7fafc;
        color: #1a202c;
        margin: 0;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }
      h1 {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #0f172a;
      }
      .indicator {
        width: 12px;
        height: 12px;
        border-radius: 9999px;
        background: #16a34a;
        box-shadow: 0 0 0 8px rgba(22, 163, 74, 0.12);
      }
      button {
        background: #0ea5e9;
        border: none;
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        transition: transform 0.1s ease, box-shadow 0.2s ease;
        box-shadow: 0 8px 20px rgba(14, 165, 233, 0.24);
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(14, 165, 233, 0.32);
      }
      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      .log {
        margin-top: 16px;
        padding: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-family: 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono',
          'Courier New', monospace;
        font-size: 14px;
        white-space: pre-wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 9999px;
        background: #dcfce7;
        color: #166534;
        font-weight: 600;
        font-size: 13px;
      }
      .footer {
        margin-top: 16px;
        color: #475569;
        font-size: 14px;
      }
      a {
        color: #0ea5e9;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1><span class="indicator" aria-hidden="true"></span> Nettoyer le cache</h1>
      <p>
        Utilisez cet outil pour désinscrire les Service Workers et supprimer tous les
        caches PWA avant de recharger l'application.
      </p>

      <div class="badge" id="version-badge">Cache version : v3</div>

      <button id="clear-btn">🚿 Purger le cache et relancer</button>
      <div class="log" id="log">Prêt à nettoyer…</div>
      <p class="footer">
        Une fois le nettoyage terminé, rechargez l'application ou retournez à
        <a href="/">l'accueil</a>.
      </p>
    </div>

    <script>
      const logEl = document.getElementById('log')
      const button = document.getElementById('clear-btn')

      function log(message) {
        logEl.textContent += `\n• ${message}`
      }

      async function clearCaches() {
        button.disabled = true
        logEl.textContent = 'Nettoyage en cours…'

        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations()
          if (registrations.length === 0) {
            log('Aucun Service Worker actif')
          }
          for (const registration of registrations) {
            await registration.unregister()
            log('Service Worker désinscrit')
          }
        }

        if (window.caches) {
          const cacheKeys = await caches.keys()
          if (cacheKeys.length === 0) {
            log('Aucun cache à supprimer')
          }
          for (const key of cacheKeys) {
            await caches.delete(key)
            log(`Cache supprimé: ${key}`)
          }
        }

        log('Nettoyage terminé ✅')
        setTimeout(() => {
          window.location.href = '/'
        }, 800)
      }

      button.addEventListener('click', clearCaches)
    </script>
  </body>
</html>
