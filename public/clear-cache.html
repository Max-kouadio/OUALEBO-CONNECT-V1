<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nettoyage du Cache - OUALEBO Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #1a202c;
      font-size: 28px;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      color: #718096;
      text-align: center;
      margin-bottom: 30px;
    }

    .status {
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }

    .status.info {
      background: #ebf8ff;
      color: #2c5282;
      border: 2px solid #4299e1;
    }

    .status.success {
      background: #f0fff4;
      color: #22543d;
      border: 2px solid #48bb78;
    }

    .status.error {
      background: #fff5f5;
      color: #742a2a;
      border: 2px solid #f56565;
    }

    button {
      width: 100%;
      padding: 16px;
      background: #8B1538;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    button:hover {
      background: #6d0f2a;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(139, 21, 56, 0.4);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
    }

    .info-box {
      background: #f7fafc;
      border-left: 4px solid #4299e1;
      padding: 15px;
      margin-top: 20px;
      border-radius: 4px;
    }

    .info-box h3 {
      color: #2d3748;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .info-box ul {
      list-style: none;
      padding-left: 0;
    }

    .info-box li {
      color: #4a5568;
      font-size: 13px;
      margin-bottom: 8px;
      padding-left: 20px;
      position: relative;
    }

    .info-box li:before {
      content: "✓";
      position: absolute;
      left: 0;
      color: #48bb78;
      font-weight: bold;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 Nettoyage du Cache</h1>
    <p class="subtitle">Cabinet Civil Numérique V2</p>

    <div id="status" class="status info">
      Prêt à nettoyer le cache et les Service Workers
    </div>

    <button id="cleanBtn" onclick="cleanEverything()">
      <span id="btnText">Nettoyer Maintenant</span>
    </button>

    <button onclick="window.location.href='/'" style="background: #4299e1;">
      Retour à l'Application
    </button>

    <div class="info-box">
      <h3>Cette opération va :</h3>
      <ul>
        <li>Désinscrire tous les Service Workers</li>
        <li>Supprimer tous les caches du navigateur</li>
        <li>Vider le localStorage et sessionStorage</li>
        <li>Recharger la page automatiquement</li>
      </ul>
    </div>
  </div>

  <script>
    async function cleanEverything() {
      const statusEl = document.getElementById('status');
      const btnEl = document.getElementById('cleanBtn');
      const btnTextEl = document.getElementById('btnText');

      btnEl.disabled = true;
      btnTextEl.innerHTML = '<span class="spinner"></span>Nettoyage en cours...';
      statusEl.className = 'status info';
      statusEl.textContent = 'Nettoyage en cours...';

      let messages = [];

      try {
        // 1. Unregister all Service Workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
            messages.push(`✓ Service Worker désinscrit`);
          }
          if (registrations.length === 0) {
            messages.push('ℹ Aucun Service Worker trouvé');
          }
        }

        // 2. Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let cacheName of cacheNames) {
            await caches.delete(cacheName);
            messages.push(`✓ Cache supprimé: ${cacheName}`);
          }
          if (cacheNames.length === 0) {
            messages.push('ℹ Aucun cache trouvé');
          }
        }

        // 3. Clear localStorage
        try {
          localStorage.clear();
          messages.push('✓ localStorage vidé');
        } catch (e) {
          messages.push('⚠ Erreur localStorage: ' + e.message);
        }

        // 4. Clear sessionStorage
        try {
          sessionStorage.clear();
          messages.push('✓ sessionStorage vidé');
        } catch (e) {
          messages.push('⚠ Erreur sessionStorage: ' + e.message);
        }

        // Success!
        statusEl.className = 'status success';
        statusEl.innerHTML = messages.join('<br>') + '<br><br><strong>✓ Nettoyage terminé avec succès!</strong>';

        btnTextEl.textContent = 'Rechargement...';

        // Reload after 2 seconds
        setTimeout(() => {
          window.location.href = '/';
        }, 2000);

      } catch (error) {
        statusEl.className = 'status error';
        statusEl.innerHTML = `❌ Erreur: ${error.message}<br><br>${messages.join('<br>')}`;
        btnEl.disabled = false;
        btnTextEl.textContent = 'Réessayer';
      }
    }

    // Auto-clean on load if ?auto=true
    if (window.location.search.includes('auto=true')) {
      window.addEventListener('load', () => {
        setTimeout(cleanEverything, 500);
      });
    }
  </script>
</body>
</html>
